name: ueberauth_docusign CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest 1.18 series
          - elixir: "1.18.5"
            otp: "27.3"
            quality: false
          # Latest 1.19 series with OTP 28
          - elixir: "1.19.5"
            otp: "28.5"
            quality: false
          # Latest 1.20 series with OTP 29
          - elixir: "1.20.1"
            otp: "29.0"
            quality: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      # Standard caching pattern based on Phoenix Framework
      - name: Cache deps
        id: cache-deps
        uses: actions/cache@v5
        env:
          cache-name: deps-v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock', 'mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.cache-name }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Cache compiled build
        id: cache-build
        uses: actions/cache@v5
        env:
          cache-name: build-v3
        with:
          path: _build
          key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock', 'mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.cache-name }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      # Cache PLT files for Dialyzer
      - name: Cache Dialyzer PLT
        uses: actions/cache@v5
        if: matrix.quality
        env:
          cache-name: dialyzer-plt-v3
        with:
          path: priv/plts
          key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock', 'mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.cache-name }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      # Only clean if cache not found
      - name: Install Dependencies
        run: |
          if [ ! -d "deps" ]; then
            echo "Cache not found, performing clean install"
            mix local.hex --force
            mix local.rebar --force
          fi
          mix deps.get

      - name: Compile app
        run: MIX_ENV=test mix compile --warnings-as-errors

      - name: Run Tests
        run: mix test --trace

      - name: Check formatting
        if: matrix.quality
        run: mix format --check-formatted

      - name: Run Credo
        if: matrix.quality
        run: mix credo --strict

      - name: Run Dialyzer
        if: matrix.quality
        run: |
          mkdir -p priv/plts
          mix dialyzer --format dialyxir

      - name: Check Documentation
        if: matrix.quality
        run: mix docs
